# Checks every push and pull request; a push to main also deploys the Worker
# that serves kheprios.com (docs/architecture/hosting-cloudflare.md).
#
# The deploy needs two repository secrets: CLOUDFLARE_API_TOKEN (a token from
# the "Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID. Each
# deployment's message is the commit SHA, so `wrangler deployments list` says
# which commit is live.
#
# Prettier and the e2e suite are not run here: the tree is not yet
# prettier-clean, and e2e needs the Go API, Postgres and the provider stubs.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Emblem motion copies match design/
        run: scripts/brand/emblem-guard.sh
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - name: Route size budget (size-budget.json)
        run: node scripts/size-budget.mjs

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time, and the newest push wins.
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require the Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the repository secrets."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Deploy
        run: bunx wrangler deploy --message "${GITHUB_SHA::7}" --tag "${GITHUB_SHA::7}"
      - name: Smoke test
        run: |
          for path in / /login /healthz; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://kheprios.com$path")
            echo "$path $code"
            [ "$code" = 200 ] || exit 1
          done
      # The beta Worker (wrangler.jsonc env.beta, ADR 0005): the same build with
      # the experiments switched on, on its workers.dev URL. Deployed after
      # production is known good.
      - name: Deploy beta
        run: |
          out=$(bunx wrangler deploy --env beta --message "${GITHUB_SHA::7}" --tag "${GITHUB_SHA::7}" 2>&1)
          echo "$out"
          url=$(echo "$out" | grep -o 'https://[^ ]*workers\.dev' | head -1)
          [ -n "$url" ] || { echo "::error::no workers.dev URL in the beta deploy output"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url/login")
          echo "$url/login $code"
          [ "$code" = 200 ]
