<!doctype html>
<html lang="%lang%" class="%htmlclass%" data-appearance="%appearance%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Khepri" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/assets/brand/pwa-180.png" />
		<link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg" />
		<link rel="icon" type="image/png" href="/assets/brand/pwa-192.png" />
		<link rel="preload" href="/assets/fonts/geist/geist-variable.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
		%monopreload%
		<link rel="preload" href="/assets/fonts/marcellus/marcellus-regular.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
		<script>
			// "system" is the one appearance the server cannot decide: the answer
			// lives in the OS. Settle it before the stylesheet paints, and keep
			// following it while the page stays in system mode.
			(function () {
				var root = document.documentElement;
				var query = window.matchMedia('(prefers-color-scheme: dark)');
				function follow() {
					if (root.getAttribute('data-appearance') !== 'system') return;
					var dark = query.matches;
					if (root.classList.contains('dark') === dark) return;
					root.classList.toggle('dark', dark);
					document.dispatchEvent(
						new CustomEvent('theme-changed', { bubbles: true, detail: { appearance: 'system', dark: dark } })
					);
				}
				follow();
				query.addEventListener('change', follow);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body class="h-full bg-background text-foreground antialiased" data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
